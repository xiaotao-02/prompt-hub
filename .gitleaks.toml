title = "Prompt Hub gitleaks config"

[extend]
useDefault = true

[allowlist]
description = "测试占位符与示例文件"
paths = [
  '''(?i)(^|/)src/.*\.test\.ts$''',
  '''(?i)(^|/)services/api/src/.*\.test\.ts$''',
  '''(?i)(^|/)scripts/.*\.ts$''',
  '''(?i)(^|/)services/api/\.env\.example$''',
  '''(?i)(^|/)website/\.env\.example$''',
  '''(?i)(^|/)docs/CHROME_WEB_STORE_CI\.md$''',
  '''(?i)(^|/)store-listing/.*$''',
]
regexes = [
  '''sk-test''',
  '''sk-a''',
  '''sk-xxxx''',
  '''dev-only-change-me''',
  '''test-jwt-secret''',
  '''0123456789abcdef0123456789abcdef''',
  '''change-me-in-production''',
  '''YOUR_CLIENT_SECRET''',
  '''sk-••••''',
]
