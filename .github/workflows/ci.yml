name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Block sensitive filenames in PR
        if: github.event_name == 'pull_request'
        run: |
          set -euo pipefail
          base="${{ github.event.pull_request.base.sha }}"
          head="${{ github.event.pull_request.head.sha }}"
          blocked=$(git diff --name-only "$base" "$head" \
            | grep -E '(^|/)\.env$|\.envpack$|upstreams\.json$|\.pem$|\.key$|(^|/)private-backup/|output/zeabur-' \
            | grep -v '\.env\.example$' || true)
          if [ -n "$blocked" ]; then
            echo "::error::PR contains sensitive files (.env, .envpack, upstreams.json, .pem, .key, private-backup, output/zeabur-*). Use .env.example instead."
            echo "$blocked"
            exit 1
          fi

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      - name: Test
        run: npm run test

      - name: Build
        run: npm run build

      - name: Knip
        run: npm run knip
